<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran Modern • Dana • Gopay • QRIS</title>
  <!-- Google Font & Font Awesome untuk ikon keren -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* RESET & GLOBAL */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0b0e14;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Background efek glow & pattern */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 20%, rgba(0, 200, 255, 0.15), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(150, 0, 255, 0.15), transparent 45%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 6px);
      pointer-events: none;
      z-index: 0;
    }

    /* CARD UTAMA */
    .payment-card {
      position: relative;
      z-index: 2;
      max-width: 580px;
      width: 100%;
      background: rgba(18, 22, 33, 0.85);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 2.5rem;
      padding: 2rem 2rem 2.2rem;
      box-shadow: 
        0 30px 50px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.03),
        inset 0 1px 1px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: transform 0.3s ease;
      animation: fadeUp 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(25px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #b0c4ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 i {
      background: linear-gradient(145deg, #2b8aff, #9f5aff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-size: 2rem;
    }

    .header .sub {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 6px;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    /* SECTION LABEL */
    .section-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #a0b3d9;
      margin-bottom: 0.8rem;
      margin-top: 1.2rem;
    }

    .section-label i {
      font-size: 1rem;
      color: #3b82f6;
    }

    /* METHOD CARD */
    .method-card {
      background: rgba(30, 36, 52, 0.7);
      border-radius: 1.8rem;
      padding: 1.2rem 1.4rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: 0 8px 16px -8px rgba(0, 0, 0, 0.5);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.8rem;
    }

    .method-card:hover {
      border-color: rgba(59, 130, 246, 0.4);
      background: rgba(36, 44, 66, 0.8);
      box-shadow: 0 12px 20px -10px rgba(0, 120, 255, 0.3);
    }

    .method-icon {
      width: 48px;
      height: 48px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.3);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    }

    .method-detail {
      flex: 1;
    }

    .method-name {
      font-weight: 600;
      font-size: 1rem;
      color: #f0f4ff;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .method-name .badge {
      font-size: 0.65rem;
      background: #1e3a8a;
      padding: 2px 8px;
      border-radius: 20px;
      color: #bbd7ff;
      font-weight: 500;
      letter-spacing: 0.2px;
      border: 1px solid #2e4a8a;
    }

    .account-number {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      line-height: 1.3;
      font-family: 'Inter', monospace;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .account-number i {
      font-size: 0.9rem;
      color: #3b82f6;
      cursor: pointer;
      transition: color 0.2s;
      background: rgba(59,130,246,0.2);
      padding: 6px;
      border-radius: 50%;
    }

    .account-number i:hover {
      color: #60a5fa;
      background: rgba(59,130,246,0.3);
    }

    .account-name {
      font-size: 0.85rem;
      color: #9aa9c4;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .account-name i {
      font-size: 0.7rem;
      color: #4b6a9e;
    }

    /* QRIS BOX */
    .qris-box {
      background: linear-gradient(145deg, #121826, #1a2132);
      border-radius: 1.8rem;
      padding: 1.2rem 1.4rem;
      border: 1px solid rgba(59, 130, 246, 0.3);
      box-shadow: 0 8px 18px -6px #00000055, 0 0 0 1px rgba(59,130,246,0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.2rem;
      margin-top: 0.4rem;
      transition: all 0.2s;
    }

    .qris-box:hover {
      border-color: #3b82f6;
      box-shadow: 0 12px 22px -8px #1e3a8a80;
    }

    .qris-text {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .qris-text i {
      font-size: 2.5rem;
      background: linear-gradient(145deg, #2563eb, #7c3aed);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .qris-text .label {
      font-weight: 600;
      color: white;
      font-size: 1rem;
    }

    .qris-text .sub-label {
      font-size: 0.8rem;
      color: #9aa9c4;
      margin-top: 2px;
    }

    .btn-download {
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      border: none;
      color: white;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.75rem 1.4rem;
      border-radius: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.25s;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 8px 16px -6px #1e3a8a;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-download i {
      font-size: 1rem;
    }

    .btn-download:hover {
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      box-shadow: 0 12px 20px -8px #3b82f6;
      transform: scale(1.02);
    }

    /* CONFIRMATION NOTE */
    .confirmation-note {
      background: rgba(16, 185, 129, 0.07);
      border-left: 4px solid #10b981;
      border-radius: 14px;
      padding: 0.9rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 1.5rem;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(16, 185, 129, 0.15);
    }

    .confirmation-note i {
      font-size: 1.4rem;
      color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      padding: 8px;
      border-radius: 50%;
    }

    .confirmation-note p {
      color: #bbf0d9;
      font-weight: 500;
      font-size: 0.9rem;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .confirmation-note p span {
      background: #10b98120;
      padding: 2px 10px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #6ee7b7;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* COPY TOOLTIP (efek kecil) */
    .copy-feedback {
      font-size: 0.7rem;
      color: #60a5fa;
      background: #0f172a;
      padding: 2px 8px;
      border-radius: 20px;
      transition: opacity 0.2s;
      opacity: 0.8;
    }

    /* Garis pemisah */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      margin: 1.5rem 0 0.5rem;
    }

    /* Responsive */
    @media (max-width: 500px) {
      .payment-card {
        padding: 1.5rem 1.2rem;
        border-radius: 2rem;
      }

      .method-card {
        padding: 1rem;
        flex-wrap: wrap;
      }

      .account-number {
        font-size: 1.1rem;
      }

      .qris-box {
        flex-direction: column;
        align-items: flex-start;
      }

      .btn-download {
        width: 100%;
        justify-content: center;
      }

      .header h1 {
        font-size: 1.5rem;
      }
    }

    /* Ikon Dana & Gopay (warna kustom) */
    .fa-wallet, .fa-mobile-alt {
      filter: drop-shadow(0 0 6px rgba(59,130,246,0.6));
    }

    .dana-color { color: #118eea; }
    .gopay-color { color: #00a5cf; }
    .qris-glow { text-shadow: 0 0 12px #3b82f6; }
  </style>
</head>
<body>

  <div class="payment-card">
    <!-- HEADER -->
    <div class="header">
      <h1>
        <i class="fas fa-credit-card"></i> 
        Pembayaran
      </h1>
      <div class="sub">
        <i class="fas fa-shield-alt" style="margin-right: 4px; opacity: 0.7;"></i> 
        Pilih metode favoritmu
      </div>
    </div>

    <!-- METODE DANA -->
    <div class="section-label">
      <i class="fas fa-circle" style="font-size: 0.5rem; color: #3b82f6;"></i> 
      E-WALLET
    </div>

    <div class="method-card">
      <div class="method-icon" style="background: #0a1a2f;">
        <i class="fas fa-wallet dana-color" style="color: #118eea;"></i>
      </div>
      <div class="method-detail">
        <div class="method-name">
          DANA 
          <span class="badge">INSTAN</span>
        </div>
        <div class="account-number">
          0877 4546 0192
          <i class="fas fa-copy" onclick="copyToClipboard('087745460192', this)" title="Salin nomor"></i>
        </div>
        <div class="account-name">
          <i class="fas fa-user-circle"></i> A/N SUBARIYATI
        </div>
      </div>
    </div>

    <!-- METODE GOPAY -->
    <div class="method-card">
      <div class="method-icon" style="background: #0a1f2a;">
        <i class="fas fa-mobile-alt gopay-color" style="color: #00a5cf;"></i>
      </div>
      <div class="method-detail">
        <div class="method-name">
          GOPAY 
          <span class="badge" style="background: #0f4b5e; color: #9ee6ff;">INSTAN</span>
        </div>
        <div class="account-number">
          0877 4546 0192
          <i class="fas fa-copy" onclick="copyToClipboard('087745460192', this)" title="Salin nomor"></i>
        </div>
        <div class="account-name">
          <i class="fas fa-user-circle"></i> A/N MANZJB2
        </div>
      </div>
    </div>

    <!-- SECTION QRIS -->
    <div class="section-label" style="margin-top: 1.8rem;">
      <i class="fas fa-qrcode" style="color: #a855f7;"></i> 
      QRIS (SEMUA BANK & E-WALLET)
    </div>

    <div class="qris-box">
      <div class="qris-text">
        <i class="fas fa-qrcode"></i>
        <div>
          <div class="label">Scan & Bayar</div>
          <div class="sub-label">Download QRIS di bawah</div>
        </div>
      </div>
      <a href="https://files.catbox.moe/io5ikd.jpg" class="btn-download" target="_blank" rel="noopener noreferrer">
        <i class="fas fa-download"></i> DOWNLOAD QRIS
      </a>
    </div>

    <!-- BUKTI TRANSFER -->
    <div class="confirmation-note">
      <i class="fas fa-check-circle"></i>
      <p>
        <span>WAJIB</span> 
        Sertakan bukti transfer dengan jelas ✅
      </p>
    </div>

    <!-- FOOTER KECIL / DIVIDER -->
    <div class="divider"></div>
    <div style="display: flex; justify-content: center; gap: 1.5rem; font-size: 0.7rem; color: #3b4a62; margin-top: 0.6rem;">
      <span><i class="fas fa-lock" style="margin-right: 4px;"></i> Aman & Terenkripsi</span>
      <span><i class="fas fa-clock" style="margin-right: 4px;"></i> Proses Cepat</span>
    </div>
  </div>

  <!-- SCRIPT SEDERHANA UNTUK COPY -->
  <script>
    function copyToClipboard(text, el) {
      navigator.clipboard.writeText(text).then(() => {
        // Simpan ikon asli
        const originalIcon = el.className;
        el.className = 'fas fa-check';
        el.style.color = '#10b981';
        el.style.background = 'rgba(16,185,129,0.2)';
        
        // Kembalikan setelah 1.5 detik
        setTimeout(() => {
          el.className = originalIcon;
          el.style.color = '#3b82f6';
          el.style.background = 'rgba(59,130,246,0.2)';
        }, 1500);
      }).catch(err => {
        alert('Gagal menyalin: ' + err);
      });
    }
  </script>
</body>
</html>
